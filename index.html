<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 업무 도구 모음</title>

    <style>
        /* ==========================================
           기본 색상 및 공통 스타일
           ========================================== */
        :root {
            --navy: #1f3a6d;        /* 포인트 남색 */
            --navy-dark: #152a52;   /* 눌렀을 때 진한 남색 */
            --navy-soft: #eef2f9;   /* 연한 남색 배경 */
            --navy-line: #d5deec;   /* 남색 계열 테두리 */
            --line: #e5e9f0;        /* 일반 테두리 */
            --text: #1e293b;        /* 본문 글자색 */
            --muted: #6b7686;       /* 보조 글자색 */
            --faint: #9aa4b2;       /* 흐린 글자색 */
            --wait: #b26a00;        /* 준비 중 배지 글자 */
            --wait-bg: #fff4e0;     /* 준비 중 배지 배경 */
            --radius: 18px;         /* 카드 모서리 */
            --shadow: 0 4px 18px rgba(31, 58, 109, 0.08);
            --shadow-hover: 0 14px 32px rgba(31, 58, 109, 0.16);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            /* 외부 글꼴 없이: 설치된 Noto Sans KR → 맑은 고딕 → 애플 고딕 순, 이모지는 컬러 이모지 글꼴 */
            font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo',
                         'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
            background: #ffffff;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            width: 100%;
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ==========================================
           위쪽: 제목 + 검색창
           ========================================== */
        .hero {
            padding: 56px 0 32px;
            text-align: center;
        }
        .hero h1 {
            margin: 0;
            font-size: 36px;
            font-weight: 900;
            color: var(--navy);
            letter-spacing: -0.8px;
        }
        .hero p {
            margin: 10px 0 0;
            font-size: 16px;
            color: var(--muted);
        }

        .search-box {
            position: relative;
            max-width: 480px;
            margin: 28px auto 0;
        }
        .search-box .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--faint);
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: #fff;
            border: 1px solid var(--navy-line);
            border-radius: 999px;
            outline: none;
            box-shadow: var(--shadow);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input:focus {
            border-color: var(--navy);
            box-shadow: 0 0 0 4px rgba(31, 58, 109, 0.14);
        }

        /* 검색 결과 개수 안내 */
        .result-info {
            margin: 12px 0 0;
            min-height: 18px;
            font-size: 13px;
            color: var(--faint);
        }

        /* ==========================================
           가운데: 도구 카드 격자
           ========================================== */
        .main { flex: 1; padding-bottom: 56px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 26px 22px 22px;
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s;
        }
        /* 마우스를 올리면 살짝 떠오르는 효과 */
        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--navy-line);
        }

        .card-emoji {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            line-height: 1;
            background: var(--navy-soft);
            border-radius: 18px;
            margin-bottom: 16px;
        }
        .card h2 {
            margin: 0 0 6px;
            font-size: 18px;
            font-weight: 700;
            color: var(--navy);
        }
        .card p {
            margin: 0 0 20px;
            font-size: 14px;
            line-height: 1.55;
            color: var(--muted);
            flex: 1;   /* 설명 길이가 달라도 버튼 위치를 맞춤 */
        }

        /* 준비 중 배지 */
        .badge-wait {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--wait);
            background: var(--wait-bg);
            border-radius: 999px;
        }

        /* 열기 버튼 */
        .btn-open {
            display: block;
            text-align: center;
            padding: 11px 0;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: var(--navy);
            border-radius: 12px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-open:hover { background: var(--navy-dark); }
        .btn-open:focus-visible { outline: 3px solid rgba(31, 58, 109, 0.35); outline-offset: 2px; }

        /* 준비 중인 카드: 버튼 비활성 */
        .card.not-ready .card-emoji { filter: grayscale(0.4); opacity: 0.85; }
        .card.not-ready .btn-open {
            color: var(--faint);
            background: #f1f4f8;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* 검색 결과 없음 */
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 48px 0;
            color: var(--faint);
            font-size: 15px;
        }

        /* ==========================================
           맨 아래: 만든 사람
           ========================================== */
        .footer {
            border-top: 1px solid var(--line);
            padding: 22px 16px 28px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }
        .footer strong { color: var(--navy); }

        /* ==========================================
           휴대폰 화면: 한 줄에 카드 하나
           ========================================== */
        @media (max-width: 560px) {
            .hero { padding: 40px 0 24px; }
            .hero h1 { font-size: 28px; }
            .hero p { font-size: 14px; }
            .grid { grid-template-columns: 1fr; gap: 16px; }
        }
    </style>
</head>
<body>

    <!-- 위쪽: 제목, 부제, 검색창 -->
    <header class="wrap hero">
        <h1>나의 업무 도구 모음</h1>
        <p>바이브 코딩으로 직접 만든 업무 도우미</p>

        <div class="search-box">
            <!-- 돋보기 아이콘 (외부 라이브러리 없이 SVG로 직접 그림) -->
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
            </svg>
            <input type="search" id="searchInput" class="search-input"
                   placeholder="도구 이름이나 설명으로 검색" aria-label="도구 검색">
        </div>
        <p id="resultInfo" class="result-info"></p>
    </header>

    <!-- 가운데: 도구 카드 격자 (JS가 TOOLS 배열을 보고 만듦) -->
    <main class="wrap main">
        <div id="toolGrid" class="grid"></div>
    </main>

    <!-- 맨 아래: 만든 사람 -->
    <footer class="footer">
        <span id="footerText"></span>
    </footer>

    <script>
        // ==========================================
        // 설정값: 여기만 고치면 됩니다
        // ==========================================

        // 만든 사람 이름
        const AUTHOR_NAME = '○○○';

        // 도구 목록: 한 줄 추가하면 카드가 하나 생깁니다.
        //   emoji : 카드 이모지 (\u{...}는 이모지 코드값, 직접 이모지를 넣어도 됩니다)
        //   name  : 도구 이름
        //   desc  : 한 줄 설명
        //   url   : 열 파일 이름
        //   ready : true = 사용 가능, false = "준비 중" 배지 표시
        const TOOLS = [
            { emoji: '\u{1F371}', name: '점심 메뉴 룰렛',     desc: '오늘 점심을 대신 정해 드려요',            url: 'lunch.html',     ready: true  }, // 🍱
            { emoji: '\u{1F4C4}', name: 'PDF 병합·분할기',    desc: '여러 PDF를 합치고 나눠요',                url: 'pdf-tool.html',  ready: true  }, // 📄
            { emoji: '\u{1F4CA}', name: '자동 데이터 분석기', desc: '파일만 넣으면 분석하고 차트를 추천해요', url: 'analyzer.html',  ready: true  }, // 📊
            { emoji: '\u{26A1}',  name: '전력수요 대시보드',  desc: '공공데이터로 본 우리나라 전력 사용',      url: 'dashboard.html', ready: true }, // ⚡
        ];

        // ==========================================
        // DOM 요소
        // ==========================================
        const toolGrid = document.getElementById('toolGrid');
        const searchInput = document.getElementById('searchInput');
        const resultInfo = document.getElementById('resultInfo');
        const footerText = document.getElementById('footerText');

        // ==========================================
        // 카드 하나 만들기
        // ==========================================
        function createCard(tool) {
            const card = document.createElement('article');
            card.className = 'card' + (tool.ready ? '' : ' not-ready');

            // 준비 중 배지
            if (!tool.ready) {
                const badge = document.createElement('span');
                badge.className = 'badge-wait';
                badge.textContent = '준비 중';
                card.appendChild(badge);
            }

            // 큰 이모지
            const emoji = document.createElement('div');
            emoji.className = 'card-emoji';
            emoji.setAttribute('aria-hidden', 'true');
            emoji.textContent = tool.emoji;

            // 도구 이름
            const title = document.createElement('h2');
            title.textContent = tool.name;

            // 한 줄 설명
            const desc = document.createElement('p');
            desc.textContent = tool.desc;

            // 열기 버튼 (준비 중이면 누를 수 없음)
            const btn = document.createElement('a');
            btn.className = 'btn-open';
            if (tool.ready) {
                btn.href = tool.url;
                btn.textContent = '열기';
                btn.setAttribute('aria-label', `${tool.name} 열기`);
            } else {
                btn.textContent = '준비 중';
                btn.setAttribute('aria-disabled', 'true');
            }

            card.append(emoji, title, desc, btn);
            return card;
        }

        // ==========================================
        // 카드 목록 그리기 (검색어로 거르기)
        // ==========================================
        function renderTools() {
            const keyword = searchInput.value.trim().toLowerCase();

            // 이름이나 설명에 검색어가 들어간 도구만 남김
            const list = TOOLS.filter(t =>
                !keyword ||
                t.name.toLowerCase().includes(keyword) ||
                t.desc.toLowerCase().includes(keyword)
            );

            toolGrid.innerHTML = '';

            if (list.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty';
                empty.textContent = `"${searchInput.value.trim()}"에 맞는 도구가 없어요.`;
                toolGrid.appendChild(empty);
            } else {
                list.forEach(tool => toolGrid.appendChild(createCard(tool)));
            }

            // 검색 중일 때만 결과 개수 표시
            resultInfo.textContent = keyword ? `전체 ${TOOLS.length}개 중 ${list.length}개` : '';
        }

        // ==========================================
        // 초기 실행
        // ==========================================
        footerText.innerHTML = '';
        const nameEl = document.createElement('strong');
        nameEl.textContent = AUTHOR_NAME;
        footerText.append('만든 사람: ', nameEl, ' · 2026 바이브 코딩 실습');

        searchInput.addEventListener('input', renderTools);
        renderTools();
    </script>
</body>
</html>
